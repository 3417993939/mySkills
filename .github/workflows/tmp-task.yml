name: Fix Missing Submodule Gitlinks (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-add missing submodule gitlinks
        run: |
          set -e
          git config -f .gitmodules --remove-section submodule.agents365_ai_drawio_skill || true
          git config -f .gitmodules --remove-section submodule.gpui-kit || true
          git add .gitmodules

          git submodule add -b main https://github.com/Agents365-ai/drawio-skill.git agents365_ai_drawio_skill
          git submodule add -b main https://github.com/longbridge/gpui-kit.git gpui-kit

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: re-add missing submodule gitlinks"
          git push
