name: Rename Submodule (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}   # 注意：不递归拉子模块，避免旧 url 失效报错

      - name: Rename submodule path
        run: |
          set -e
          OLD=gpui-component
          NEW=gpui-kit
          NEW_URL=https://github.com/longbridge/gpui-kit.git

          SHA=$(git ls-tree HEAD $OLD | awk '{print $3}')

          # 用同样的 commit 重建新 path 的 gitlink（不需要子模块内容）
          git rm --cached $OLD
          git update-index --add --cacheinfo 160000,$SHA,$NEW

          # 改 .gitmodules：改名 + path + url + branch
          git config -f .gitmodules --rename-section submodule.$OLD submodule.$NEW
          git config -f .gitmodules submodule.$NEW.path $NEW
          git config -f .gitmodules submodule.$NEW.url $NEW_URL
          git config -f .gitmodules submodule.$NEW.branch main

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rename submodule $OLD -> $NEW"
          git push
